[project]
name = "speech-to-text"
version = "0.1.0"
description = "AI-powered speech transcription and text processing, running entirely on OpenRouter"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.44.1",
    "python-dotenv",
    "streamlit-mic-recorder",
    "pydub",
    "openai",
    "requests",
    "mcp",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
addopts = "--import-mode=importlib"
